# This file was made with the assistance of generative AI.
# CI for the conditional kinetic miniapp (ckm). ckm is built as part of riot
# (RIOT_BUILD_CKM=ON) but only the ckm targets are compiled here; riot's own test
# suite stays in unit-tests.yml. Runs when the miniapp, the riot files that wire it
# in, the Parthenon pin, or this workflow change.
name: ckm

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "conditional_kinetic_miniapp/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "external/parthenon"
      - ".github/CODEOWNERS"
      - ".github/workflows/ckm.yml"
  push:
    branches: [main, "wtaitano/ckm"]
    paths:
      - "conditional_kinetic_miniapp/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "external/parthenon"
      - ".github/CODEOWNERS"
      - ".github/workflows/ckm.yml"

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

permissions:
  contents: read

jobs:
  boundary:
    name: ckm boundary
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check isolation boundary
        run: ./conditional_kinetic_miniapp/script/check_boundary.sh

  docs:
    # Build only; ckm docs are not deployed (riot's gh-pages deploy replaces the site).
    name: ckm docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs (warnings are errors)
        run: |
          pip install sphinx sphinx-rtd-theme
          sphinx-build -W --keep-going -n conditional_kinetic_miniapp/doc/sphinx _build/ckm-docs

  build:
    name: ckm (${{ matrix.mode }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            mpi: "OFF"
            hdf5_pkg: libhdf5-dev
          - mode: mpi
            mpi: "ON"
            hdf5_pkg: libhdf5-mpich-dev
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize riot dependencies
        run: |
          git submodule update --init --recursive \
            external/parthenon \
            external/kokkos-kernels \
            external/singularity-eos \
            external/singularity-opac

      - name: Identify dependency revisions
        id: dependencies
        run: |
          echo "hash=$(git submodule status --recursive | sha256sum | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            ninja-build \
            libcatch2-dev \
            ${{ matrix.hdf5_pkg }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ckm-v2-${{ runner.os }}-${{ matrix.mode }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            ccache-ckm-v2-${{ runner.os }}-${{ matrix.mode }}-

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DRIOT_BUILD_CKM=ON \
            -DRIOT_ENABLE_UNIT_TESTS=ON \
            -DRIOT_ENABLE_MPI=${{ matrix.mpi }} \
            -DRIOT_BUILD_CATCH2=OFF \
            -DRIOT_BUILD_PYTHON=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel 4 --target ckm ckm_unit_tests
          ccache --show-stats
          ctest --test-dir build/conditional_kinetic_miniapp --output-on-failure
